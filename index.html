<body>
    <main class="container">
        <h1>Texture Tools</h1>

        <section class="column">
            <h2>Upload and Settings</h2>
            <form id="imageUploadForm">
                <input type="file" id="imageInput" name="imageInput" required />
                <button id="uploadButton">Submit Image</button>
            </form>
            
            <label for="pixelateFactorSlider">Pixelate Factor: </label>
            <input id="pixelateFactorSlider" type="range" min="1" value="1" max="30" name="pixelateFactorSlider" oninput="pixelateFactorOutput.value = this.value">
            <output id="pixelateFactorOutput" for="pixelateFactorSlider">1</output>
            
            <label for="posterizationSlider">Posterization Factor: </label>
            <input id="posterizationSlider" type = "range" min="1" value="1000" max="1000" name="posterizationSlider" oninput="posterizationSliderOutput.value = this.value">
            <output id="posterizationSliderOutput" for="posterizationSlider">1000</output>

        </section>

        <section class="column">
            <h2>Output</h2>
            <img id="outputPreview">
            <div id="output"></div>

        </section>

    <script type="module" src="/script.js"></script>
</body>
