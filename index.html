<body>
    <main class="container">
        <h1>Texture Tools</h1>

        <section class="column">
            <h2>Upload and Settings</h2>
            <form id="imageUploadForm">
                <input type="file" id="imageInput" name="imageInput" required />
                <button id="uploadButton">Submit Image</button>
            </form>
            
            <div class="effect">
                <p draggable="true">Pixelation</p>
                <form id="pixelateForm">
                    <label for="pixelateFactorSlider">Pixelate Factor: </label>
                    <input id="pixelateFactorSlider" type="range" min="1" value="1" max="50" name="pixelateFactorSlider" oninput="pixelateFactorOutput.value = this.value">
                    <output id="pixelateFactorOutput" for="pixelateFactorSlider">1</output>
                </form>
            </div>
                
            <div class="effect">
                <p draggable="true">Posterization</p>
                <form id="posteriazationForm">
                    <label for="posterizationSlider">Posterization Factor: </label>
                    <input id="posterizationSlider" type="range" min="1" value="10" max="30" name="posterizationSlider" oninput="posterizationSliderOutput.value = this.value">
                    <output id="posterizationSliderOutput" for="posterizationSlider">10</output>
                </form>
                <form>
                    <label for="posterizationCheckbox">Posterize?</label>
                    <input type="checkbox" id="posterizationCheckbox" name="posterizationCheckbox" value="yes">
                </form>
            </div>

            <div class="effect">
                <p draggable="true">Tint</p>
                <form id="tintForm">
                    <label for="tintColor">Tint Color: </label>
                    <input id="tintColor" type="color" name="tintColor value=#FFFFFF">
                </form>
            </div>

        </section>

        <section class="column">
            <h2>Output</h2>
            <img id="outputPreview">
            <div id="output"></div>
            <button id="exportButton">Export!</button>
            <img id="exportImage">
        </section>

    <canvas id='blank' style='display:none'></canvas>
    <script type="module" src="/script.js"></script>
</body>
