<body>
    <main class="container">
        <audio id="hoverSound" src="https://cdn.hackclub.com/01a1ddbb-5be0-7281-abac-8f5364e75aff/Hover.mp3" preload="auto"></audio>
        <audio id="clickSound" src="https://cdn.hackclub.com/01a1ddbb-5b4a-7c03-ae07-1fcece919128/ButtonClick.mp3" preload="auto"></audio>
        <audio id="exportSound" src="https://cdn.hackclub.com/01a1ddce-98b2-7959-9261-ab6a8f1dd36c/PartyBlower.mp3" preload="auto"></audio>
        <audio id="tickSound" src="https://cdn.hackclub.com/01a1e154-f71a-70ba-a2ec-129d089b5c00/tick.mp3" preload="auto"></audio>

        <h1 style="padding: 0px">
            <image src="https://cdn.hackclub.com/01a1dc3c-fa71-773f-88fb-1e3be6f7cb45/texture-tools-banner.png" width="500"></image>
        </h1>
        <h2 id="subTitle">A retro-focused editor for images and textures.</h2>

        <section class="column">
            <h2>Upload and Settings</h2>
            <form id="imageUploadForm" >
                <input type="file" id="imageInput" name="imageInput" required accept=".png, .jpg, .jpeg"/>
                <button id="uploadButton" class="hoverSoundButton clickSoundButton">Submit Image</button>
            </form>

            <p>Effects are applied from top to bottom. Drag headers to rearrange.</p>
            <button class="hoverSoundButton clickSoundButton" id="resetButton">Reset Effect Settings</button>
            
            <div class="effect" id="pixelateEffect">
                <h3 class="dragHeader">Pixelation</h3>
                <form id="pixelateForm" class="effectForm">
                    <label for="pixelateFactorSlider" class="effectLabel">Pixelate Factor: </label>
                    <input id="pixelateFactorSlider" type="range" min="1" value="1" max="50" name="pixelateFactorSlider" step=".1" oninput="pixelateFactorOutput.value = this.value">
                    <output id="pixelateFactorOutput" for="pixelateFactorSlider" class="effectOutput">1</output>
                </form>
            </div>
                
            <div class="effect" id="posterizationEffect">
                <h3 class="dragHeader">Posterization</h3>
                <form id="posteriazationForm" class="effectForm">
                    <label for="posterizationSlider" class="effectLabel">Posterization Factor:</label>
                    <input id="posterizationSlider" type="range" min="1" value="10" max="30" name="posterizationSlider" oninput="posterizationSliderOutput.value = this.value">
                    <output id="posterizationSliderOutput" for="posterizationSlider" class="effectOutput">10</output>
                </form>
                <form class="effectForm" id="posterizationCheckboxForm">
                    <label for="posterizationCheckbox">Apply Posterization?</label>
                    <input type="checkbox" id="posterizationCheckbox" name="posterizationCheckbox" value="yes" class="hoverSoundButton clickSoundButton">
                </form>
            </div>

            <div class="effect" id="tintEffect">
                <h3 class="dragHeader">Tint</h3>
                <form id="tintForm" class="effectForm">
                    <label for="tintColor" class="effectLabel">Tint Color: </label>
                    <input id="tintColor" type="color" name="tintColor" value="#FFFFFF" class="hoverSoundButton clickSoundButton">
                </form>
            </div>

            <div class="effect" id="greyscaleEffect">
                <h3 class="dragHeader">Greyscale</h3>
                <form id="greyscaleForm" class="effectForm">
                    <label for="greyscaleAmount" class="effectLabel">Greyscale Amount: </label>
                    <input id="greyscaleAmount" type="range" min="0" max="1" step=".01" value="0" oninput="greyscaleAmountOutput.value = this.value">
                    <output id="greyscaleAmountOutput" for="greyscaleAmount" class="effectOutput">0</output>
                </form>
            </div>

            <div class="effect" id="saturationEffect">
                <h3 class="dragHeader">Saturation</h3>
                <form id="saturationForm" class="effectForm">
                    <label for="saturationAmount" class="effectLabel">Saturation Amount: </label>
                    <input id="saturationAmount" type="range" min="1" max="5" value="1" step=".01" oninput="saturationAmountOutput.value = this.value">
                    <output id="saturationAmountOutput" for="saturationAmount" class="effectOutput">1</output>
                </form>
            </div>

            <div class="effect" id="brightnessEffect">
                <h3 class="dragHeader">Brightness</h3>
                <form id="brightnessForm" class="effectForm">
                    <label for="brightnessAmount" class="effectLabel">Brightness Amount: </label>
                    <input id="brightnessAmount" type="range" min="0.1" max="2" value="1" step=".01" oninput="brightnessAmountOutput.value = this.value">
                    <output id="brightnessAmountOutput" for="brightnessAmount" class="effectOutput">1</output>
                </form>
            </div>

            <div class="effect" id="contrastEffect">
                <h3 class="dragHeader">Contrast</h3>
                <form id="contrastForm" class="effectForm">
                    <label for="contrastAmount" class="effectLabel">Contrast Amount: </label>
                    <input id="contrastAmount" type="range" min="0" value="1" max="2" step=".01" oninput="contrastAmountOutput.value = this.value">
                    <output id="contrastAmountOutput" for="contrastAmount" class="effectOutput">1</output>
                </form>
            </div>

            <div class="effect" id="thresholdEffect">
                <h3 class="dragHeader">Threshold</h3>
                <form id="thresholdForm" class="effectForm">
                    <label for="thresholdAmount" class="effectLabel">Threshold Value:</label>
                    <input id="thresholdAmount" type="range" min="0" max="255" value="128" step="1" oninput="thresholdAmountOutput.value = this.value">
                    <output id="thresholdAmountOutput" for="thresholdAmount" class="effectOutput">128</output>
                </form>
                <form class="effectForm" id="thresholdCheckboxForm">
                    <label for="thresholdCheckboxForm">Apply Threshold?</label>
                    <input type="checkbox" id="thresholdCheckbox" name="thresholdCheckbox" value="no" class="hoverSoundButton clickSoundButton">
                </form>
            </div>

            <div class="effect" id="hueEffect">
                <h3 class="dragHeader">Hue</h3>
                <form id="hueForm" class="effectForm">
                    <label for="hueAmount" class="effectLabel">Hue Amount:</label>
                    <input id="hueAmount" type="range" min="0" max="360" value="0" oninput="hueAmountOutput.value = this.value">
                    <output id="hueAmountOutput" for="hueAmount" class="effectOutput">0</output>
                </form>
            </div>

        </section>

        <section class="column">
            <h2>Output</h2>
            <button id="originalButton">Original Image</button>
            <img id="outputPreview">
            <div id="output"></div>
            <button id="exportButton" class="hoverSoundButton">Export!</button>
            <img id="exportImage">
        </section>

        <button id="muteButton" class="hoverSoundButton clickSoundButton">
            <img src="https://cdn.hackclub.com/01a1e307-4c8f-761b-9175-dddc78d4ac5b/VolumeIconSlash.png" id="volumeMuteIcon" width="3%" hidden>
            <img src="https://cdn.hackclub.com/01a1e307-4bf3-74f7-9517-e20a69a011af/VolumeIcon.png" id="volumeIcon" width="3%">
        </button>
    <canvas id='blank' style='display:none'></canvas>
    <script type="module" src="/script.js"></script>
</body>
